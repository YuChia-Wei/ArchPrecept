name: Package CI
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ github.ref_type == 'tag' && 'Build release packages' || 'Build and test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and test the solution
        shell: pwsh
        run: |
          ./tests/Release/PreviewReleaseState.Tests.ps1
          ./eng/Build-Packages.ps1 -SkipPack:($env:GITHUB_REF_TYPE -ne 'tag')
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: preview-packages
          path: artifacts/packages/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
  consumer:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [8, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.sdk }}.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: preview-packages
          path: artifacts/packages
      - name: Install and run package consumers with the selected SDK
        shell: pwsh
        run: ./eng/Test-PackageConsumer.ps1 -SdkMajor ${{ matrix.sdk }} -ExpectedSourceCommit (git rev-parse HEAD)
