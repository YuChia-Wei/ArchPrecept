name: Package CI
on:
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: ${{ github.ref_type == 'tag' && 'Build release packages' || 'Build and test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build, test and check package contents
        shell: pwsh
        run: |
          ./.github/workflows/tests/PreviewReleaseState.Tests.ps1
          ./.github/workflows/scripts/Build-Packages.ps1
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-packages
          path: artifacts/packages/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/
  consumer:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ 8, 10 ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '${{ matrix.sdk }}.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts/packages
      - name: Install and run package consumers with the selected SDK
        shell: pwsh
        run: ./.github/workflows/scripts/Test-PackageConsumer.ps1 -SdkMajor ${{ matrix.sdk }} -ExpectedSourceCommit (git rev-parse HEAD)
