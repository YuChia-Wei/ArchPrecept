name: Publish to NuGet.org

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nuget-org
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the tagged source on main
        id: release
        env:
          NEW_TAG: ${{ github.event.created && !github.event.forced }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:NEW_TAG -ne 'true') { throw 'A release requires a newly created tag.' }
          $version = ./.github/workflows/scripts/Get-PackageVersion.ps1 -RequireTag
          if ((git cat-file -t $env:GITHUB_REF) -ne 'tag') { throw 'An annotated release tag is required.' }
          $tagCommit = git rev-parse --verify "$env:GITHUB_REF^{commit}"
          if ($tagCommit -cne (git rev-parse HEAD)) { throw 'The tag no longer identifies the checked-out revision.' }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The tagged commit must be part of main.' }
          if (!(Test-Path LICENSE)) { throw 'Approved LICENSE is required before publication.' }
          "version=$version" >> $env:GITHUB_OUTPUT

  validate:
    needs: gate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ gate, validate ]
    runs-on: ubuntu-latest
    environment: nuget-org-packages
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: preview-packages
          path: packages
      - name: Verify artifacts and confirm the release is unpublished
        shell: bash
        working-directory: packages
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in *.nupkg; do
            lower_name=${package,,}
            lower_version=${RELEASE_VERSION,,}
            id=${lower_name%.${lower_version}.nupkg}
            status=$(curl --silent --show-error --head --max-time 30 --output /dev/null --write-out '%{http_code}' \
              "https://api.nuget.org/v3-flatcontainer/$id/$lower_version/$lower_name")
            case "$status" in
              404) ;;
              200) echo "::error::$package already exists. Inspect the published release before retrying."; exit 1 ;;
              *) echo "::error::Cannot determine publication state for $package (HTTP $status)."; exit 1 ;;
            esac
          done
      - name: Get a short-lived NuGet.org publishing key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the tested packages in dependency order
        shell: bash
        working-directory: packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for id in ArchPrecept.Analyzers.Core \
            ArchPrecept.Contracts.Domain ArchPrecept.Contracts.Messaging \
            ArchPrecept.Contracts.Application ArchPrecept.Contracts.Application.Messaging \
            ArchPrecept.Contracts.Domain.EventSourcing ArchPrecept.Templates; do
            dotnet nuget push "$id.$RELEASE_VERSION.nupkg" \
              --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --no-symbols
          done

  indexed:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-packages
          path: packages
      - name: Wait for all published packages on NuGet.org
        working-directory: packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          for package in *.nupkg; do
            lower_name=${package,,}
            lower_version=${RELEASE_VERSION,,}
            id=${lower_name%.${lower_version}.nupkg}
            url="https://api.nuget.org/v3-flatcontainer/$id/$lower_version/$lower_name"
            until curl --silent --show-error --fail --head --max-time 15 --output /dev/null "$url"; do
              if (( SECONDS >= deadline )); then
                echo "::error::$package is not yet available. Check NuGet.org validation and rerun failed jobs."
                exit 1
              fi
              sleep 15
            done
          done

  registry-consumer:
    needs: indexed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [ 8, 10 ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '${{ matrix.sdk }}.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: preview-packages
          path: artifacts/packages
      - name: Verify the published packages and restore anonymously
        shell: pwsh
        run: |
          ./.github/workflows/scripts/Test-PackageConsumer.ps1 -SdkMajor ${{ matrix.sdk }} `
            -RegistrySource 'https://api.nuget.org/v3/index.json' `
            -ExpectedPackageDirectory 'artifacts/packages' -ExpectedSourceCommit (git rev-parse HEAD)
