name: Documentation

on:
  pull_request:
    branches: [main]
  push:
    tags: ['docs-*']

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event.created && !github.event.forced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify documentation release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^docs-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[1-9][0-9]*$ ]]; then
            echo "Expected an annotated docs-YYYY.MM.DD.N tag." >&2
            exit 1
          fi
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build DocFX site
        shell: pwsh
        run: |
          ./eng/Build-Documentation.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'archprecept-docs') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'archprecept-pages')
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: ${{ runner.temp }}/archprecept-pages

  deploy:
    if: github.event_name == 'push' && github.event.created
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: publish
        uses: actions/deploy-pages@v5
