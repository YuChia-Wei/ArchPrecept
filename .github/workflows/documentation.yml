name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - '.github/workflows/docfx/**'
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - '.github/workflows/docfx/**'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build DocFX site
        shell: pwsh
        run: |
          ./.github/workflows/scripts/Build-Documentation.ps1 -ScratchRoot (Join-Path $env:RUNNER_TEMP 'archprecept-docs') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'archprecept-pages')
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: ${{ runner.temp }}/archprecept-pages

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: publish
        uses: actions/deploy-pages@v5
